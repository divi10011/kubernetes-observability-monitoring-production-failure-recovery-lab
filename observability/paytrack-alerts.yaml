apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: paytrack-alerts
  namespace: monitoring-lab
  labels: {release: monitoring}
spec:
  groups:
    - name: paytrack.availability
      rules:
        - alert: ApplicationDown
          expr: min(up{job="paytrack"}) == 0
          for: 1m
          labels: {severity: critical}
          annotations: {summary: "PayTrack is unreachable"}
        - alert: PodRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace="monitoring-lab",container="paytrack"}[5m]) > 0
          for: 1m
          labels: {severity: warning}
          annotations: {summary: "A PayTrack pod restarted"}
        - alert: PodUnavailable
          expr: kube_deployment_status_replicas_available{namespace="monitoring-lab",deployment="paytrack"} < kube_deployment_spec_replicas{namespace="monitoring-lab",deployment="paytrack"}
          for: 1m
          labels: {severity: critical}
          annotations: {summary: "PayTrack has unavailable replicas"}
    - name: paytrack.resources
      rules:
        - alert: HighCPUUsage
          expr: sum(rate(container_cpu_usage_seconds_total{namespace="monitoring-lab",container="paytrack"}[5m])) / sum(kube_pod_container_resource_requests{namespace="monitoring-lab",container="paytrack",resource="cpu"}) > 0.80
          for: 5m
          labels: {severity: warning}
          annotations: {summary: "PayTrack CPU exceeds 80% of requested CPU"}
        - alert: HighMemoryUsage
          expr: sum(container_memory_working_set_bytes{namespace="monitoring-lab",container="paytrack"}) / sum(kube_pod_container_resource_limits{namespace="monitoring-lab",container="paytrack",resource="memory"}) > 0.80
          for: 5m
          labels: {severity: warning}
          annotations: {summary: "PayTrack memory exceeds 80% of its limit"}
        - alert: HighErrorRate
          expr: sum(rate(paytrack_http_errors_total{status_code=~"5.."}[5m])) / sum(rate(paytrack_http_requests_total[5m])) > 0.05
          for: 2m
          labels: {severity: warning}
          annotations: {summary: "PayTrack 5xx error rate exceeds 5%"}
