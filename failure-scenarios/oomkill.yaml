apiVersion: v1
kind: Pod
metadata: {name: oomkill-demo, namespace: monitoring-lab}
spec:
  restartPolicy: Never
  containers:
    - name: memory-stress
      image: polinux/stress:1.0.4
      args: ["--vm", "1", "--vm-bytes", "128M", "--vm-hang", "1"]
      resources:
        requests: {memory: 32Mi, cpu: 25m}
        limits: {memory: 64Mi, cpu: 100m}
