apiVersion: v1
kind: Namespace
metadata:
  name: monitoring-lab
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: paytrack
  namespace: monitoring-lab
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: paytrack-config
  namespace: monitoring-lab
data:
  PAYTRACK_ENVIRONMENT: kubernetes
  PAYTRACK_READINESS_FAILURE_MODE: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paytrack
  namespace: monitoring-lab
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: paytrack}
  template:
    metadata:
      labels: {app.kubernetes.io/name: paytrack}
    spec:
      serviceAccountName: paytrack
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: paytrack
          image: paytrack:0.1.0
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8000}]
          envFrom: [{configMapRef: {name: paytrack-config}}]
          env: [{name: TMPDIR, value: /tmp}]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
          startupProbe: {httpGet: {path: /health, port: http}, failureThreshold: 6, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          readinessProbe: {httpGet: {path: /ready, port: http}, initialDelaySeconds: 3, periodSeconds: 5}
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: paytrack
  namespace: monitoring-lab
  labels: {app.kubernetes.io/name: paytrack}
spec:
  selector: {app.kubernetes.io/name: paytrack}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: paytrack
  namespace: monitoring-lab
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: paytrack}
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 60}}
